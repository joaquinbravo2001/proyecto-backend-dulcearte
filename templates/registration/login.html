{% extends 'base_auth.html' %}
{% block title %}Iniciar Sesión{% endblock %}
{% block content %}
<div class="row justify-content-center min-vh-100 align-items-center">
    <div class="col-md-4">
        <div class="card shadow-lg border-0">
            <div class="card-header text-center py-4" style="background: linear-gradient(135deg, #c0392b, #922b21);">
                <h3 class="text-white mb-0"><i class="bi bi-cake2-fill me-2"></i>Dulce Arte</h3>
                <small class="text-white-50">Pastelería Artesanal</small>
            </div>
            <div class="card-body p-4">
                <h5 class="card-title text-center mb-4 text-muted">Iniciar Sesión</h5>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Tu usuario" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Tu contraseña" required>
                        </div>
                    </div>
                    {% if form.errors %}
                    <div class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i>Usuario o contraseña incorrectos.</div>
                    {% endif %}
                    <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
